<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Secure Data Room reviewer tour</title>
<desc id="desc">Three panels show a private workspace, PDF upload, and read-only sharing.</desc>
<rect width="1200" height="560" rx="28" fill="#f4f6f8"/>
<rect x="34" y="34" width="352" height="492" rx="20" fill="#111827"/>
<rect x="414" y="34" width="352" height="492" rx="20" fill="#fff" stroke="#d8e0ea" stroke-width="2"/>
<rect x="794" y="34" width="372" height="492" rx="20" fill="#fff" stroke="#d8e0ea" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="66" y="82" fill="#9ca9bc" font-size="14" font-weight="700" letter-spacing="3">PRIVATE WORKSPACE</text>
<text x="66" y="142" fill="#fff" font-size="30" font-weight="700">My Data Room</text>
<rect x="66" y="184" width="286" height="56" rx="12" fill="#1f2937"/><circle cx="94" cy="212" r="12" fill="#2563eb"/><text x="120" y="220" fill="#f8fafc" font-size="18">All files</text>
<rect x="66" y="258" width="286" height="56" rx="12" fill="#172033"/><text x="120" y="294" fill="#cbd5e1" font-size="18">Shared with me</text>
<text x="66" y="464" fill="#a8b5c8" font-size="15">Protected by default</text>
<text x="446" y="82" fill="#64748b" font-size="14" font-weight="700" letter-spacing="3">UPLOAD</text>
<text x="446" y="138" fill="#111827" font-size="28" font-weight="700">Add a document</text>
<rect x="446" y="176" width="288" height="172" rx="16" fill="#eef5ff" stroke="#77aaf8" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M590 220v52m-20-20 20-20 20 20" fill="none" stroke="#1261db" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="312" fill="#1261db" font-size="17" font-weight="700">Choose PDF files</text>
<rect x="446" y="386" width="288" height="58" rx="12" fill="#f8fafc"/><text x="466" y="421" fill="#334155" font-size="16">NDA_Mutual_asset.pdf</text><text x="694" y="421" fill="#64748b" font-size="14">291 KB</text>
<text x="826" y="82" fill="#64748b" font-size="14" font-weight="700" letter-spacing="3">READ-ONLY SHARE</text>
<text x="826" y="138" fill="#111827" font-size="28" font-weight="700">Share with confidence</text>
<rect x="826" y="176" width="308" height="82" rx="14" fill="#eef5ff"/><circle cx="858" cy="217" r="15" fill="#1261db"/><path d="M850 217h16m-8-8v16" stroke="#fff" stroke-width="3"/><text x="888" y="213" fill="#111827" font-size="18" font-weight="700">Public link</text><text x="888" y="237" fill="#64748b" font-size="14">View only · revoke anytime</text>
<rect x="826" y="286" width="308" height="82" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="850" y="321" fill="#111827" font-size="17" font-weight="700">Verified recipient</text><text x="850" y="346" fill="#64748b" font-size="14">Folder scope · no editing</text>
<text x="826" y="444" fill="#1261db" font-size="16" font-weight="700">Deliberate access</text><text x="826" y="472" fill="#64748b" font-size="14">Every important action is visible.</text>
</g></svg>
