name: Supabase keepalive

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Touch database-backed readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail             --show-error             --silent             --max-time 30             --retry 3             --retry-delay 10             --retry-all-errors             https://secure-data-room-api.vercel.app/v1/health/ready
