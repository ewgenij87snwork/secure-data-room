name: Supabase keepalive

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      notification_test:
        description: 'Deliberately fail after a successful SQL probe to test owner alerts'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Touch database-backed readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(
            --fail
            --show-error
            --silent
            --max-time 30
            --retry 3
            --retry-delay 10
            --retry-all-errors
          )
          url="https://secure-data-room-api.vercel.app/v1/health/ready"
          curl "${curl_args[@]}" "$url"
      - name: Explicit manual notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test }}
        run: |
          echo '::error::Deliberate notification test after a successful SQL probe; no product outage.'
          exit 1
