name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: secure_data_room_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d secure_data_room_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check PostgreSQL health
        run: pg_isready -h 127.0.0.1 -p 5432 -U ci -d secure_data_room_test
        env:
          PGPASSWORD: ci
      - run: pnpm verify
        env:
          ACCESS_POLICY_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/secure_data_room_test
